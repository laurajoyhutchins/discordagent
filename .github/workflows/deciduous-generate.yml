name: Generate Deciduous projections

on:
  push:
    branches:
      - docs/deciduous-archaeology-backfill
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify graph fragment compression
        run: |
          status=0
          for file in .deciduous/graph/*.gz; do
            if gzip -t "$file"; then
              echo "OK $file"
            else
              echo "BAD $file"
              status=1
            fi
          done
          exit "$status"
      - run: npm run deciduous:generate
      - name: Commit generated projections
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/archaeology
          if ! git diff --cached --quiet; then
            git commit -m "docs: generate Deciduous projections"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
