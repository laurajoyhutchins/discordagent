name: Inspect remaining Deciduous nodes

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Inspect node fragments 06 through 10
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          for path in sorted(Path('.deciduous/graph').glob('10-nodes-*.sql.gz'))[5:]:
              result = subprocess.run(['gzip', '-cd', str(path)], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              text = result.stdout.decode('utf-8', errors='ignore')
              print(f'===== {path.name} rc={result.returncode} bytes={len(text)} =====')
              for line in text.splitlines():
                  if not line.startswith('INSERT INTO decision_nodes '):
                      continue
                  match = re.search(r"VALUES \((\d+), '([^']+)', '([^']+)', '([^']+)'", line)
                  if match:
                      print('id=%s change_id=%s type=%s title=%s' % match.groups())
                  else:
                      print('UNPARSED ' + line[:240])
          PY
