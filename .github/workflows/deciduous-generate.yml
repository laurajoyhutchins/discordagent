name: Repair and generate Deciduous archaeology

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 scripts/repair-deciduous.py
      - run: npm run deciduous:generate
      - run: npm run deciduous:validate
      - run: npm run deciduous:check
      - name: Publish repaired graph and projections
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/deciduous-generate.yml .github/workflows/inspect-recovery.yml scripts/repair-deciduous.py
          git add -A .deciduous docs/archaeology package.json docs/README.md scripts .gitignore
          git commit -m "docs: backfill Discord Agent decision archaeology"
          git push origin "HEAD:${TARGET_BRANCH}"
