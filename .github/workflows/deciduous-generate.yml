name: Generate Deciduous projections

on:
  push:
    branches:
      - docs/deciduous-archaeology-backfill
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Recover plain SQL fragments
        run: |
          set -u
          for file in .deciduous/graph/*.sql.gz; do
            output="${file%.gz}"
            gzip -cd "$file" > "$output" 2>/dev/null || true
            test -s "$output"
            echo "RECOVERED $output $(wc -c < "$output") bytes"
            rm "$file"
          done
      - run: npm run deciduous:generate
      - run: npm run deciduous:validate
      - run: npm run deciduous:check
      - name: Commit recovered graph and generated projections
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deciduous/graph docs/archaeology
          if ! git diff --cached --quiet; then
            git commit -m "docs: recover graph and generate projections"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
